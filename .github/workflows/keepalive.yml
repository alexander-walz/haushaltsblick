name: keepalive
on:
  schedule:
    - cron: '42 5 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    if: vars.HB_INGEST_AKTIV == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Datenbank anfragen, damit Supabase Free nicht pausiert
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$DATABASE_URL" -tAc "select count(*) from ops.load_run"
